name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://containerless.dev/
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mdBook
        uses: peaceiris/actions-mdbook@ee69d230fe19748b7abf22df32acaa93833fad08 # v2.0.0
        with:
          mdbook-version: latest

      - name: Build docs
        run: mdbook build docs

      - name: Upload to Dawdle
        uses: dawdlespace/action@176fc01a848b192f009f2f8fa0f022995b825545 # v1.0.0
        with:
          site-id: x128xbg4y2
          api-key: ${{ secrets.DAWDLE_API_KEY }}
          path: docs/book
          replace: true
