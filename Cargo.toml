[workspace]
resolver = "3"
members = [
  "crates/cargo-containerless",
  "crates/containerless",
  "crates/containerless-core",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
config = { version = "0.15", default-features = false, features = [
  "json",
  "toml",
  "yaml"
] }
containerless = { path = "crates/containerless" }
containerless-core = { path = "crates/containerless-core" }
docker_credential = "1.4"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
globset = { version = "0.4", default-features = false }
hex = "0.4"
oci-client = { version = "0.17", default-features = false, features = ["rustls-tls"] }
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.11", default-features = false }
tar = { version = "0.4", default-features = false }
tempfile = "3.27"
thiserror = "2.0"
tracing = "0.1"
walkdir = "2.5"
zstd = { version = "0.14", default-features = false }
